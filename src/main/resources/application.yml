server:
  address: 127.0.0.1
  port: 8081
  servlet:
    context-path: /mc-server
  forward-headers-strategy: framework

spring:
  application:
    name: minecraft-server-controller
  thymeleaf:
    cache: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

aws:
  region: ${AWS_REGION:eu-central-1}
  lambda:
    function-name: ${LAMBDA_FUNCTION_NAME:minecraft-instance-controller}

app:
  minecraft:
    address: ${MINECRAFT_ADDRESS:localhost}
  security:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:change-me-locally}
